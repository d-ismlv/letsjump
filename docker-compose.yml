services:
  letsjump:
    image: ghcr.io/d-ismlv/letsjump:latest
    ports:
      - "32325:32325"
    environment:
      - TZ=Europe/Stockholm
      # PORT=32325            # change the in-container port (also update ports:)
    # letsjump is stateless — no volumes and no secrets, unlike danke.
    restart: unless-stopped
